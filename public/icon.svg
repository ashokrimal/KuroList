<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1016"/>
      <stop offset="50%" stop-color="#161826"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corner -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#252A40" stroke-width="6" opacity="0.6"/>

  <!-- Geometric Anime Emblem / Katana Slash Silhouette -->
  <g filter="url(#shadow)">
    <!-- Primary Slash (Left Stem) -->
    <path d="M 160 110 L 210 110 L 210 402 L 160 402 Z" fill="url(#accentGrad)" rx="8" />

    <!-- Top Diagonal Katana Blade Slash -->
    <path d="M 195 270 L 325 130 L 375 130 L 235 285 Z" fill="url(#neonGlow)" />

    <!-- Bottom Wing / Slash -->
    <path d="M 230 280 L 375 402 L 320 402 L 195 295 Z" fill="url(#accentGrad)" />

    <!-- Accent Dot / Sparkle -->
    <circle cx="360" cy="180" r="14" fill="#38BDF8" />
  </g>

  <!-- Clean Stylized "K" Kanji Slash Accents -->
  <path d="M 140 160 L 140 210" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 140 310 L 140 360" stroke="#818CF8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
